
services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: wogg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Olschool230187r
      MYSQL_DATABASE: wogg_mysql_db
      MYSQL_USER: wogg_user
      MYSQL_PASSWORD: Olschool230187u
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./mysql_database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - wogg-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 30s
      retries: 10


  # Backend Service - Micronaut API on Tomcat
  backend:
    build:
      context: ./backend/gamers_community
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      # Updated for JDK 21 and better memory management
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - MICRONAUT_ENVIRONMENTS=docker
      # Add logging level for development
      - MICRONAUT_LOG_LEVEL=INFO
    networks:
      - wogg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - backend-logs:/usr/local/tomcat/logs


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80" 
    depends_on:
      - backend

    networks:
      - wogg-network

volumes:
  mysql_data:
    driver: local
  backend-logs:


networks:
  wogg-network:
    driver: bridge


